[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapers-lib"
version = "0.2.0"
description = "Reusable multi-source scraping library with normalized schemas, attribution, and a persistent scheduler."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Swarnim"}]
keywords = ["scraping", "web-scraping", "normalization", "attribution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.28",
    "diskcache>=5.6",
    "beautifulsoup4>=4.12",
    "playwright>=1.50",
    "playwright-stealth>=1.0",
    "praw>=7.7",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "youtube-transcript-api>=0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scrapers_lib"]
