[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapers-lib"
dynamic = ["version"]
description = "Reusable multi-source scraping library with normalized schemas, attribution, and a persistent scheduler."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Swarnim"}]
keywords = ["scraping", "web-scraping", "normalization", "attribution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.28",
    "curl_cffi>=0.7",
    "diskcache>=5.6",
    "beautifulsoup4>=4.12",
    "playwright>=1.50",
    "playwright-stealth>=1.0",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "youtube-transcript-api>=0.6",
    "python-dotenv>=1.0",
    "py_mini_racer>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Local speech-to-text fallback for tier1.youtube when the caption
# endpoint is POT-gated or the uploader disabled captions. Pulls in
# yt-dlp (audio-only download) and faster-whisper (CTranslate2 Whisper
# build, CPU-only viable). First call lazily caches ~150 MB of model
# weights via the HuggingFace hub.
youtube-audio = [
    "yt-dlp>=2024.10",
    "faster-whisper>=1.0",
]

[tool.hatch.version]
path = "scrapers_lib/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["scrapers_lib"]
